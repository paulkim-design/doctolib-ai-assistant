<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vorbereitung: Doctolib prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="proto-header">
    <h1>Vorbereitung: Appointment Preparation Assistant</h1>
    <p>Clickable prototype · fixture data, no live model calls · M2 Doctolib</p>
  </header>

  <div class="proto-controls">
    <label for="scenario-select">State</label>
    <select id="scenario-select" aria-label="Select checklist state"></select>
    <label class="toggle-field" for="generic-toggle">
      <input type="checkbox" id="generic-toggle" />
      Generic appointment type
    </label>
    <label for="lang-select">Language</label>
    <select id="lang-select" aria-label="Select phone language">
      <option value="de">Deutsch (default)</option>
      <option value="en">English</option>
    </select>
    <button class="reset" id="reset-btn" type="button">Zurücksetzen</button>
    <span class="frame-badge" id="frame-badge"></span>
  </div>

  <div class="device">
    <div class="screen" id="screen"></div>
  </div>

  <div id="live-region" class="live-region" aria-live="polite"></div>

  <script src="fixtures.js"></script>
  <script src="app.js"></script>
</body>
</html>
